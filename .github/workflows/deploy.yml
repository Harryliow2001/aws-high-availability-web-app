name: Deploy to AWS

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: python -m py_compile app/server.py

      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::458018461109:role/harry-github-deploy-role
          aws-region: ap-southeast-1

      - name: Upload app to S3
        run: |
          aws s3 cp app/server.py s3://harry-bucket-project/app/server.py

      - name: Refresh EC2 instances
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name harry-web-asg
            --preferences '{"InstanceWarmup":60}'
